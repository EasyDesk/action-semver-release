name: Semantic Version Release
description: Detects semantic version from tag. Updates major and minor tags accordingly. Makes a GitHub release.

branding:
  color: gray-dark
  icon: tag

inputs:
  repo-token:
    description: GitHub Action token.
    required: true
    default: ${{ github.token }}
  version:
    description: Semantic Version of the release.
    required: true
  prefix:
    description: Human friendly release prefix. Shown on GitHub releases.
    required: false
    default: ''
  files:
    description: Files to upload as part of the release assets. Separated by new lines.
    required: false
  prerelease:
    description: Whether to set the release as prerelease on GitHub.
    required: false
    default: 'false'

outputs:
  release-url:
    description: Release url
    value: ${{ steps.github-release.outputs.url }}

runs:
  using: composite
  steps:
    - name: Align major and minor tags
      uses: actions/github-script@v9
      env:
        VERSION: ${{ inputs.version }}
      with:
        retries: 3
        script: |
          const regex = /^(?:v)?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
          const version = process.env.VERSION
          if (!regex.test(version)) {
            process.exit(1)
          }
          const match = version.match(regex)
          const major = match[1]
          const minor = match[2]
          const major_tag = 'tags/v' + major
          const minor_tag = 'tags/v' + major + '.' + minor
          const latest_tag = 'tags/latest'
          for (const tag of [major_tag, minor_tag, latest_tag]) {
            try {
              await github.rest.git.deleteRef({ ...context.repo, ref: tag })
            } catch (e) {
              if (e.status !== 404 && e.status !== 422) {
                throw e
              }
            }

            await github.rest.git.createRef({ ...context.repo, ref: `refs/${tag}` , sha: process.env.GITHUB_SHA })
          }
    - name: Create GitHub Release
      id: github-release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.repo-token }}
        VERSION: ${{ inputs.version }}
        PREFIX: ${{ inputs.prefix }}
        FILES: ${{ inputs.files }}
        PRERELEASE: ${{ inputs.prerelease }}
      run: |
        set -euo pipefail
        shopt -s nullglob

        # --repo is required: consumers need not have checked the repo out,
        # and without it gh infers the target from git remotes.
        args=(--repo "$GITHUB_REPOSITORY" --generate-notes --title "${PREFIX:+$PREFIX }$VERSION")
        if [[ "$PRERELEASE" == "true" ]]; then
          args+=(--prerelease)
        fi
        while IFS= read -r pattern; do
          [[ -n "$pattern" ]] || continue
          matches=($pattern)
          if [[ ${#matches[@]} -eq 0 ]]; then
            echo "::error::No files matched: $pattern"
            exit 1
          fi
          args+=("${matches[@]}")
        done <<< "$FILES"

        # The releases API intermittently answers 5xx, so retry rather than
        # failing the whole release on a blip.
        for attempt in 1 2 3; do
          if url="$(gh release create "$GITHUB_REF_NAME" "${args[@]}")"; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if url="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json url -q .url 2>/dev/null)"; then
            echo "Release for $GITHUB_REF_NAME exists; attempt $attempt got through."
            echo "url=$url" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::gh release create failed (attempt $attempt of 3)"
          sleep $((attempt * 10))
        done
        echo "::error::Could not create release for $GITHUB_REF_NAME after 3 attempts"
        exit 1
